# Bootstrap: HTTP only. After certs exist, run:
#   sudo certbot --apache -d transfer.d-side.pro
# Certbot will add the :443 vhost (or extend this file). Do not reference
# /etc/letsencrypt/... paths here until those files exist.

<VirtualHost *:80>
    ServerName transfer.d-side.pro

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    LimitRequestBody 0

    ProxyPass / http://127.0.0.1:3000/ retry=0 timeout=300
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/transfer.d-side.pro-error.log
    CustomLog ${APACHE_LOG_DIR}/transfer.d-side.pro-access.log combined
</VirtualHost>
